:root {
  --ground: #fcfdfe;
  --rail: #f3f5f9;
  --navy: #001848;
  --ink: #0d1733;
  --ink-2: #444c63;
  --ink-3: #656d82;
  --rule: #e2e6ee;
  --rule-2: #cfd5e1;
  --pen: #0055fb;
  --pen-2: #0043c9;
  --pen-wash: #e6eeff;
  --hl: #c9daff;
  --hl-2: #b5ccff;
  --past: #c08a2a;
  --credit: #15171c;
  --debit: #b8322a;
  --ok: #1b7443;
  --warn: #b8322a;
  --display: "Bricolage Grotesque Variable", "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --ui: "Hanken Grotesk Variable", "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: #c9cbc6 transparent; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-top: 40px; }
::selection { background: var(--hl); color: var(--navy); }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
a { color: var(--pen); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { color: var(--pen-2); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* highlighter: a marker stroke laid under text, drawn left to right */
.hl {
  background-image: linear-gradient(100deg, rgba(201, 218, 255, 0) 0.6%, var(--hl) 2.2%, #d3e1ff 12%, var(--hl) 60%, var(--hl-2) 94%, rgba(201, 218, 255, 0) 98%);
  background-repeat: no-repeat; background-size: 100% 58%; background-position: 0 86%;
  padding: 0 0.12em; margin: 0 -0.12em; border-radius: 0.2em 0.5em 0.3em 0.6em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hl.draw { animation: draw 0.9s var(--ease-out) both; }
@keyframes draw { from { background-size: 0% 58%; } to { background-size: 100% 58%; } }

/* ---------- prototype chrome (not part of the design) ---------- */
.proto-bar { position: fixed; inset: 0 0 auto 0; z-index: 80; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: #0d0e10; color: #e9eaec; font-size: 12.5px; }
.proto-bar b { color: #fff; }
.proto-bar .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proto-bar button { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid #3a3d44; background: #1b1d21; color: #fff; font-size: 12.5px; font-weight: 600; }
.proto-bar button[aria-expanded="true"] { background: #fff; color: #0d0e10; }
.proto-panel { position: fixed; z-index: 79; top: 40px; right: 0; width: min(360px, 100vw); max-height: calc(100svh - 40px); overflow: auto; padding: 16px 16px 24px; background: #0d0e10; color: #d9dbdf; font-size: 13px; box-shadow: 0 24px 48px rgba(0,0,0,.35); transform: translateY(-8px); opacity: 0; visibility: hidden; transition: transform .28s var(--ease-out), opacity .2s, visibility 0s .28s; }
.proto-panel.open { transform: none; opacity: 1; visibility: visible; transition: transform .28s var(--ease-out), opacity .2s; }
.proto-panel h3 { margin: 18px 0 8px; font-size: 11.5px; font-weight: 700; color: #9ea3ad; letter-spacing: .06em; text-transform: uppercase; }
.proto-panel h3:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 6px 10px; border-radius: 8px; border: 1px solid #30333a; background: #17191c; color: #e9eaec; font-size: 12.5px; }
.chips button[aria-pressed="true"] { background: #fff; color: #0d0e10; border-color: #fff; font-weight: 600; }
.proto-action { width: 100%; margin-top: 10px; height: 40px; border-radius: 8px; border: 0; background: #fff; color: #0d0e10; font-weight: 700; font-size: 13px; }
.proto-note { margin: 16px 0 0; color: #8d929c; font-size: 12px; line-height: 1.5; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: calc(100svh - 40px); }
.rail { display: none; }
.topbar { position: sticky; top: 40px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 16px; background: var(--ground); border-bottom: 1px solid var(--rule); }
.wordmark { display: inline-flex; align-items: center; text-decoration: none; }
.wordmark img { display: block; height: 26px; width: auto; }
.rail .wordmark img { height: 30px; }
.store-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.store-chip .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--ground); font-size: 11.5px; font-weight: 800; }
.main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 20px 16px 110px; }
.tabbar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--ground); border-top: 1px solid var(--rule); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-decoration: none; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--navy); }
.tabbar a[aria-current="page"] span { background: linear-gradient(var(--hl), var(--hl)) no-repeat 0 85% / 100% 55%; padding: 0 3px; border-radius: 3px; }

.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 550; }
.nav a:hover { background: #ebebe7; color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav a[aria-current="page"] .lbl { background: linear-gradient(100deg, rgba(201,218,255,0) 1%, var(--hl) 4%, var(--hl) 94%, rgba(201,218,255,0) 99%) no-repeat 0 88% / 100% 60%; padding: 0 4px; margin: 0 -4px; border-radius: 3px 6px 4px 7px; }
.nav .grp { margin: 18px 10px 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); }

/* ---------- page heads ---------- */
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.pagehead h1 { margin: 0; color: var(--navy); font-family: var(--display); font-size: clamp(26px, 3.2vw, 34px); line-height: 1.05; font-weight: 750; letter-spacing: -0.03em; }
.pagehead p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: #efefeb; }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(21,23,28,.12), 0 2px 6px -2px rgba(21,23,28,.1); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--pen); background: var(--pen); color: #fff; font-size: 14.5px; font-weight: 700; text-decoration: none; transition: background-color .15s, transform .12s var(--ease-out); }
.btn:hover { background: var(--pen-2); border-color: var(--pen-2); color: #fff; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--rule-2); }
.btn.ghost:hover { border-color: var(--ink-3); background: #fff; color: var(--ink); }
.btn.danger { background: var(--debit); border-color: var(--debit); }
.btn.danger:hover { background: #9c2922; border-color: #9c2922; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }

/* ---------- overview ---------- */
.today { display: grid; gap: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--rule); }
.figure .lbl { font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.figure .big { margin-top: 2px; font-family: var(--display); font-size: clamp(44px, 9.6vw, 76px); line-height: 1; font-weight: 750; letter-spacing: -0.04em; font-stretch: 92%; white-space: nowrap; }
.figure .big small { font-size: 0.42em; font-weight: 700; letter-spacing: -0.01em; margin-right: 0.18em; vertical-align: 0.62em; }
.delta { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14.5px; font-weight: 600; }
.delta.up { color: var(--pen); }
.delta.down { color: var(--debit); }
.delta svg { width: 16px; height: 16px; stroke-width: 2.25; }
.delta .vs { color: var(--ink-2); font-weight: 500; }
.facts { margin-top: 6px; color: var(--ink-2); font-size: 14px; }

.pend-block h2, .block h2 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.pend-block .sum { margin-top: 2px; font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.pend-block .why { font-size: 14px; color: var(--ink-2); }
.plist { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.plist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.plist .who { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .amt { text-align: right; font-weight: 600; font-style: italic; color: var(--ink-2); }
.plist .when { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.plist .when svg { width: 14px; height: 14px; }
.plist .soon { color: var(--warn); font-weight: 600; }
.more { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 600; font-size: 14px; }
.more svg { width: 16px; height: 16px; }

.block { padding: 26px 0; border-bottom: 1px solid var(--rule); }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.block-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--pen); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.chart { position: relative; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--rule); stroke-width: 1; }
.chart .axis text { fill: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chart .end-label { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
.chart .end-label.muted { fill: var(--ink-2); font-weight: 600; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; min-width: 170px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--rule-2); box-shadow: 0 10px 24px -8px rgba(21,23,28,.22); font-size: 13px; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip .t { font-weight: 700; margin-bottom: 4px; color: var(--ink-2); font-size: 12px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-size: 15px; font-variant-numeric: tabular-nums; min-width: 88px; }
.tip .r i { width: 14px; height: 2px; border-radius: 2px; }
.tip .r span { color: var(--ink-3); }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); padding: 8px 0; border-bottom: 1px solid var(--rule-2); }
table.data td { padding: 8px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
table.data .r { text-align: right; }

/* ---------- the statement ---------- */
.stmt { margin-top: 4px; }
.day { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 0 8px; border-bottom: 1.5px solid var(--navy); position: sticky; top: 96px; z-index: 5; background: var(--ground); }
.day h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.day .tot { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14.5px; }
.day .tot span { color: var(--ink-3); font-weight: 500; margin-right: 6px; font-size: 13px; }
.entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; transition: background-color .15s, box-shadow .15s; }
.entry:hover { background: var(--pen-wash); box-shadow: -8px 0 0 var(--pen-wash), 8px 0 0 var(--pen-wash); color: inherit; }
.entry .mn { flex: 1; min-width: 0; display: grid; gap: 2px; }
.entry .tm { display: none; }
.entry .rt { flex: none; display: grid; gap: 2px; justify-items: end; }
.entry .who { font-weight: 650; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.entry .amt { text-align: right; font-weight: 700; font-size: 15.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry .sub { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px; white-space: nowrap; min-width: 0; overflow: hidden; }
.entry .sub > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.entry .sub > span:not(:first-child) { flex: none; }
.entry .st { text-align: right; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.entry .st.bad { color: var(--debit); }
.entry.pending .amt { font-style: italic; color: var(--ink-2); font-weight: 600; }
.entry.pending .st { color: var(--ink-3); font-style: italic; }
.entry.pending .st.soon { color: var(--debit); font-style: normal; font-weight: 600; }
.entry.dead .amt { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; font-weight: 500; }
.entry.refund .amt { color: var(--debit); }
.entry.fresh { animation: fresh 1.8s var(--ease-out) both; }
@keyframes fresh { 0% { background: color-mix(in srgb, var(--hl) 70%, transparent); transform: translateY(-6px); opacity: 0; } 25% { opacity: 1; transform: none; } 100% { background: transparent; } }
.dotsep::before { content: "·"; margin-right: 6px; }

/* ---------- orders page ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.filters button { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-2); background: #fff; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.filters button .n { margin-left: 4px; font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; }
.search { position: relative; flex: 1 1 240px; max-width: 360px; }
.search input { width: 100%; height: 40px; padding: 0 12px 0 38px; border-radius: 10px; border: 1.5px solid var(--rule-2); background: #fff; font-size: 15px; }
.search input:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-wash); }
.search svg { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.empty { padding: 40px 0; text-align: center; color: var(--ink-2); }
.empty h3 { margin: 0 0 4px; font-family: var(--display); font-size: 20px; color: var(--ink); }

/* ---------- order detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; margin-bottom: 12px; }
.back svg { width: 16px; height: 16px; }
.od-head { padding-bottom: 20px; border-bottom: 1.5px solid var(--ink); }
.od-head .ref { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.od-head .big { font-family: var(--display); font-size: clamp(40px, 7vw, 56px); font-weight: 750; letter-spacing: -0.04em; line-height: 1.05; margin-top: 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.badge svg { width: 14px; height: 14px; stroke-width: 2.25; }
.badge.ok { background: #e3f1e8; color: var(--ok); }
.badge.wait { background: #fbf0dc; color: var(--warn); }
.badge.bad { background: #f8e4e2; color: var(--debit); }
.badge.off { background: #ececea; color: var(--ink-2); }
.od-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.od-grid { display: grid; gap: 0 48px; }
.sect { padding: 20px 0; border-bottom: 1px solid var(--rule); }
.sect h2 { margin: 0 0 12px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.kv { display: grid; gap: 10px; margin: 0; }
.kv div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; font-size: 14.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 56px 18px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; font-size: 14.5px; }
.tl li::before { content: ""; position: absolute; left: 74px; top: 20px; bottom: 0; width: 1.5px; background: var(--rule-2); }
.tl li:last-child::before { display: none; }
.tl .tm { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.tl .dt { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--ink); background: var(--ground); }
.tl li.ok .dt { background: var(--ok); border-color: var(--ok); }
.tl small { display: block; color: var(--ink-3); font-size: 13px; }
.note { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #e3f1e8; color: #134f2f; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }

dialog { border: 0; padding: 0; border-radius: 14px; width: min(440px, calc(100vw - 32px)); box-shadow: 0 30px 60px -12px rgba(21,23,28,.35); color: var(--ink); }
dialog::backdrop { background: rgba(21, 23, 28, 0.42); }
dialog .in { padding: 22px; }
dialog h2 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: -0.02em; }
dialog p { margin: 8px 0 0; color: var(--ink-2); }
dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ---------- products ---------- */
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.prow .th { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; grid-row: span 3; }
.prow .th .mono-tile, .gw .mk { display: grid; place-items: center; width: 100%; height: 100%; background: var(--pen-wash); color: var(--navy); font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
.prow .nm { font-weight: 700; font-size: 15.5px; }
.prow .mt { font-size: 13px; color: var(--ink-3); }
.prow .pr { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.prow .sl { text-align: right; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.prow .nums { grid-column: 2; display: flex; gap: 24px; }
.prow .nums .pr, .prow .nums .sl { text-align: left; }
.prow .ac { grid-column: 2 / -1; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #ececea; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.tag.live { background: #e3f1e8; color: var(--ok); }

/* ---------- integrations ---------- */
.route { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.route .m { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.route select { width: 100%; max-width: 320px; height: 40px; padding: 0 36px 0 12px; appearance: none; -webkit-appearance: none; background: #fff url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23444c63%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27m6 9 6 6 6-6%27/%3E%3C/svg%3E") right 10px center / 18px no-repeat; border-radius: 10px; border: 1.5px solid var(--rule-2); font-size: 14.5px; font-weight: 600; }
.route select:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-wash); }
.gw { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.gw .mk { width: 40px; height: 40px; border-radius: 10px; grid-row: span 2; font-size: 14px; }
.gw .nm { font-weight: 700; font-size: 15.5px; }
.gw .ms { font-size: 13px; color: var(--ink-3); }
.gw .rt { grid-row: span 2; }
.gw .ok { color: var(--ok); font-size: 13px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.gw .ok svg { width: 15px; height: 15px; stroke-width: 2.25; }
.placeholder { padding: 48px 0; max-width: 520px; }
.placeholder h1 { font-family: var(--display); margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
.placeholder p { color: var(--ink-2); margin: 0; }
.steps { list-style: none; margin: 16px 0 0; padding: 0; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 15px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.steps li.done::before { content: ""; background: var(--navy) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M5 12.5l4.5 4.5L19 7.5%27/%3E%3C/svg%3E") center / 14px no-repeat; border-color: var(--navy); }
.steps small { display: block; color: var(--ink-3); font-size: 13.5px; }

@media (min-width: 720px) {
  .main { padding: 28px 28px 64px; }
  .filters { margin: 0; padding: 2px 0; }
}
@media (min-width: 1024px) {
  .shell { grid-template-columns: 244px minmax(0, 1fr); }
  .rail { display: flex; flex-direction: column; position: sticky; top: 40px; height: calc(100svh - 40px); overflow: auto; padding: 22px 14px; background: var(--rail); border-right: 1px solid var(--rule); }
  .rail .wordmark { margin: 0 10px 20px; }
  .rail .store { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--rule); }
  .topbar, .tabbar { display: none; }
  .main { padding: 36px 44px 72px; }
  .day { top: 40px; }
  .today { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 56px; align-items: start; }
  .stmt-desk .entry { display: grid; grid-template-columns: 56px minmax(0, 1fr) 190px 130px; grid-template-areas: "tm mn st amt"; align-items: center; }
  .stmt-desk .entry .rt { display: contents; }
  .stmt-desk .entry .mn { grid-area: mn; }
  .stmt-desk .entry .amt { grid-area: amt; }
  .stmt-desk .entry .st { grid-area: st; justify-self: start; }
  .stmt-desk .entry .tm { display: block; grid-area: tm; color: var(--ink-3); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .stmt-desk .entry .st { text-align: left; }
  .stmt-desk .entry .sub .t-m { display: none; }
  .od-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .prow { grid-template-columns: 48px minmax(0, 1fr) 320px; align-items: center; }
  .prow .th { grid-row: span 2; }
  .prow .nums { grid-column: 3; grid-row: 1 / span 2; display: grid; grid-template-columns: 1fr 1fr; }
  .prow .nums .pr, .prow .nums .sl { text-align: right; }
  .prow .ac { grid-column: 2; }
}
@media (max-width: 1023.98px) {
  .plist { display: none; }
  .pagehead { margin-bottom: 12px; }
  .pagehead p { font-size: 13.5px; }
  .today { gap: 14px; padding-bottom: 16px; }
  .figure .big { font-size: 44px; }
  .facts { font-size: 13px; }
  .pend-block { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--rule); }
  .pend-block h2 { font-size: 15px; font-family: var(--ui); font-weight: 700; }
  .pend-block .sum { font-size: 22px; margin: 0; text-align: right; }
  .pend-block .why, .pend-block .more { grid-column: 1 / -1; }
  .pend-block .more { margin-top: 4px; }
  .block { padding: 16px 0; }
  .cap-long { display: none; }
  .block-head { margin-bottom: 8px; }
  .chart svg { max-height: 200px; }
  .delta { margin-top: 6px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

const NOW = new Date(); NOW.setHours(16, 20, 0, 0);
const DAY = 86400000;
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const PRODUCTS = [
  { id: "p1", name: "Curso Confeitaria de Vitrine", price: 197, kind: "Digital", status: "Ativo", slug: "confeitaria-de-vitrine", w: 0.5 },

const NAMES = ["Ana Souza", "João Lima", "Marina Santos", "Rogério Pires", "Tainá Moreira", "Beatriz Alves", "Carlos Eduardo", "Fernanda Rocha", "Lucas Martins", "Patrícia Gomes", "Rafael Nunes", "Juliana Costa", "Diego Ferreira", "Camila Ribeiro", "Thiago Barros", "Larissa Teixeira", "Bruno Carvalho", "Aline Mendes", "Gustavo Araújo", "Renata Dias", "Vinícius Castro", "Débora Freitas", "Henrique Lopes", "Isabela Cardoso", "Mateus Correia", "Natália Farias", "Otávio Pinto", "Priscila Moura"];
const METHOD = { pix: "Pix", card: "Cartão", boleto: "Boleto" };
const GATEWAY = { pix: "Asaas", card: "Mercado Pago", boleto: "Asaas" };
function pickProduct() { let x = rnd(), acc = 0; for (const p of PRODUCTS) { acc += p.w; if (x <= acc) return p; } return PRODUCTS[0]; }
function hourWeight(h) { return [0.2,0.1,0.05,0.03,0.03,0.05,0.2,0.5,0.9,1.2,1.4,1.5,1.6,1.4,1.3,1.5,1.7,1.6,1.8,2.2,2.4,2.1,1.4,0.7][h]; }

let ORDERS = [];
let refN = 48213;
function buildOrders() {
  seed = 7; ORDERS = []; refN = 48213; let nameI = 0;
  const start = new Date(NOW); start.setHours(0, 0, 0, 0);
  for (let d = 6; d >= 0; d--) {
    const dayStart = start.getTime() - d * DAY;
    const perDay = d === 0 ? 30 : 26 + Math.floor(rnd() * 12);
    const stamps = [];
    for (let i = 0; i < perDay; i++) {
      let h; do { h = Math.floor(rnd() * 24); } while (rnd() * 2.4 > hourWeight(h));
      const t = dayStart + h * 3600000 + Math.floor(rnd() * 3600000);
      if (d === 0 && t > NOW.getTime()) { i--; continue; }
      stamps.push(t);
    }
    stamps.sort((a, b) => a - b);
    for (const t of stamps) {
      const p = pickProduct();
      const r = rnd();
      const method = p.kind === "Físico" && r < 0.25 ? "boleto" : r < 0.68 ? "pix" : r < 0.93 ? "card" : "boleto";
      const age = NOW.getTime() - t;
      let status = "Aprovado";
      const q = rnd();
      if (method === "pix" && age < 30 * 60000) status = q < 0.7 ? "Pendente" : "Aprovado";
      else if (method === "boleto" && age < 2 * DAY) status = q < 0.3 ? "Pendente" : "Aprovado";
      else if (method === "pix" && q < 0.14) status = "Expirado";
      else if (method === "card" && q < 0.1) status = "Recusado";
      else if (q > 0.985) status = "Reembolsado";
      const name = NAMES[(nameI = (nameI + 1 + Math.floor(rnd() * 5)) % NAMES.length)];
      ORDERS.push({ ref: "", t, name, email: name.toLowerCase().normalize("NFD").replace(/[^a-z ]/g, "").replace(" ", ".") + "@email.com", product: p, amount: p.price, method, status, installments: method === "card" && rnd() < 0.35 ? 3 : 1 });
    }
  }
  ORDERS.sort((a, b) => b.t - a.t);
  ORDERS.forEach((o, i) => { o.ref = "PVX-" + (refN - i); });
  // One refunded sale yesterday, so the statement shows a debit line.
  const y = ORDERS.find((o) => o.t < start.getTime() && o.t > start.getTime() - DAY && o.status === "Aprovado" && o.method === "card");
  if (y) y.status = "Reembolsado";
}

/* ---------- statement rows ---------- */
function entry(o, desk) {
  const cls = o.status === "Pendente" ? "pending" : o.status === "Expirado" || o.status === "Recusado" ? "dead" : o.status === "Reembolsado" ? "refund" : "";
  const sign = o.status === "Aprovado" ? "+ " : o.status === "Reembolsado" ? "− " : "";
  const st = o.status === "Pendente" ? (o.method === "boleto" ? "a receber · boleto" : pixLeft(o)) : o.status === "Aprovado" ? (o.method === "card" && o.installments > 1 ? `${o.installments}x no cartão` : "recebido") : o.status === "Reembolsado" ? "reembolsado" : o.status === "Expirado" ? "Pix expirou" : "cartão recusado";
  return `<a class="entry ${cls} ${state.fresh === o.ref ? "fresh" : ""}" href="#pedido/${o.ref}">
    <span class="tm">${hhmm(o.t)}</span>
    <span class="mn"><span class="who">${esc(o.name)}</span><span class="sub"><span>${esc(o.product.name)}</span><span class="dotsep">${METHOD[o.method]}</span><span class="dotsep t-m">${hhmm(o.t)}</span></span></span>
    <span class="rt"><span class="amt">${sign}${brl(o.amount)}</span><span class="st ${o.status === "Recusado" ? "bad" : ""} ${o.status === "Pendente" && o.method === "pix" && (o.t + 30 * 60000 - NOW.getTime()) < 10 * 60000 ? "soon" : ""}">${st}</span></span>
  </a>`;
}
function pixLeft(o) {
  const left = Math.max(0, Math.round((o.t + 30 * 60000 - NOW.getTime()) / 60000));
  return `a receber · ${left} min`;
}
function dayLabel(t) {
  const d0 = today0();
  if (t >= d0) return "Hoje";
  if (t >= d0 - DAY) return "Ontem";
  return new Date(t).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "short" }).replace(".", "");
}
function statement(list, desk = true) {
  if (!list.length) return `<div class="empty"><h3>Nenhum pedido aqui</h3><p>Mude o filtro ou a busca para ver outros pedidos.</p></div>`;
  const groups = new Map();
  for (const o of list) { const k = startOf(o.t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
  return `<div class="stmt ${desk ? "stmt-desk" : ""}">${[...groups.entries()].map(([k, os]) => {
    const tot = os.filter((o) => o.status === "Aprovado").reduce((s, o) => s + o.amount, 0) - os.filter((o) => o.status === "Reembolsado").reduce((s, o) => s + o.amount, 0);
    return `<section aria-label="${dayLabel(k)}"><div class="day"><h3>${dayLabel(k)}</h3><span class="tot"><span>saldo do dia</span>+ R$ ${brl(tot)}</span></div>${os.map((o) => entry(o, desk)).join("")}</section>`;
  }).join("")}</div>`;
}

/* ---------- chart: cumulative sales, today vs yesterday ---------- */
function cumulative(dayStart, uptoHour) {
  const pts = [];
  let acc = 0;
  for (let h = 0; h <= uptoHour; h++) {
    pts.push([h, acc]);
    acc += sumApproved(dayStart + h * 3600000, dayStart + (h + 1) * 3600000);
  }
  return pts;
}
function niceMax(v) { const step = v > 4000 ? 1000 : v > 1000 ? 500 : 100; return Math.ceil(v / step) * step; }
function chartSvg() {
  const t0 = today0(), y0 = t0 - DAY;
  const nowH = NOW.getHours() + NOW.getMinutes() / 60;
  const today = cumulative(t0, Math.floor(nowH));
  today.push([nowH, sumApproved(t0, NOW.getTime())]);
  const yest = cumulative(y0, 24);
  const main = document.getElementById("main");
  const cs = main ? getComputedStyle(main) : null;
  const W = Math.max(300, Math.round(main ? main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) : 1000));
  const H = 240, L = 52, R = 62, T = 12, B = 26;
  const max = niceMax(Math.max(...yest.map((p) => p[1]), ...today.map((p) => p[1])) * 1.05);
  const x = (h) => L + (h / 24) * (W - L - R);
  const y = (v) => T + (1 - v / max) * (H - T - B);
  const path = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const ticks = [0, Math.round(max / 2 / 100) * 100, max];
  const tl = today[today.length - 1], yl = yest[yest.length - 1];
  return { svg: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Vendas acumuladas de hoje até ${hhmm(NOW)}: R$ ${brl(tl[1])}. Ontem no dia todo: R$ ${brl(yl[1])}.">
      <g class="grid">${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
      <g class="axis">${ticks.map((v) => `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : v}</text>`).join("")}
        ${[0, 6, 12, 18, 24].map((h) => `<text x="${x(h)}" y="${H - 6}" text-anchor="middle">${h}h</text>`).join("")}</g>
      <path d="${path(yest)}" fill="none" stroke="var(--past)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${path(today)}L${x(tl[0])},${y(0)}L${x(0)},${y(0)}Z" fill="var(--pen)" fill-opacity="0.1" stroke="none"/>
      <path d="${path(today)}" fill="none" stroke="var(--pen)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="cross" id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" vector-effect="non-scaling-stroke" style="display:none"/>
    </svg>`, meta: { W, H, L, R, T, B, x, y, max, today, yest, nowH } };
}
function chartBlock() {
  const { svg, meta } = chartSvg();

  const table = `<table class="data"><thead><tr><th>Hora</th><th class="r">Hoje (acumulado)</th><th class="r">Ontem (acumulado)</th></tr></thead><tbody>${

function interp(pts, h) {
  if (h <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (h <= pts[i][0]) { const [a, va] = pts[i - 1], [b, vb] = pts[i]; return va + (vb - va) * ((h - a) / (b - a || 1)); }
  return pts[pts.length - 1][1];
}
function wireChart() {
  const el = document.getElementById("chart"); if (!el) return;
  const svg = el.querySelector("svg"), tip = document.getElementById("tip"), cross = document.getElementById("cross");
  const m = window.__chart;
  // end markers and direct labels live in an HTML overlay so they keep their shape at any width
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:absolute;inset:0;pointer-events:none;transition:opacity .12s";
  const put = (h, v, color, text, muted) => {
    const px = (m.x(h) / m.W) * 100, py = (m.y(v) / m.H) * 240;
    overlay.insertAdjacentHTML("beforeend", `<span style="position:absolute;left:calc(${px}% - 5px);top:${py - 5}px;width:10px;height:10px;border-radius:50%;background:${color};box-shadow:0 0 0 2px var(--ground)"></span>
      <span style="position:absolute;left:calc(${px}% + 9px);top:${py - 9}px;font-size:12.5px;font-weight:${muted ? 600 : 700};color:${muted ? "var(--ink-2)" : "var(--ink)"};white-space:nowrap">${text}</span>`);
  };
  const tl = m.today[m.today.length - 1], yl = m.yest[m.yest.length - 1];
  put(tl[0], tl[1], "var(--pen)", "Hoje");
  put(yl[0], yl[1], "var(--past)", "Ontem", true);
  el.appendChild(overlay);
  overlay.id = "endlabels";
  const show = (clientX) => {
    const r = svg.getBoundingClientRect();
    const vx = ((clientX - r.left) / r.width) * m.W;
    let h = Math.round(((vx - m.L) / (m.W - m.L - m.R)) * 24);
    h = Math.max(0, Math.min(24, h));
    const X = m.x(h);
    cross.setAttribute("x1", X); cross.setAttribute("x2", X); cross.style.display = "";
    tip.replaceChildren();
    const t = document.createElement("div"); t.className = "t"; t.textContent = `Até as ${h}h`; tip.appendChild(t);
    const row = (val, color, label) => { const d = document.createElement("div"); d.className = "r"; const i = document.createElement("i"); i.style.background = color; const b = document.createElement("b"); b.textContent = val; const s = document.createElement("span"); s.textContent = label; d.append(i, b, s); tip.appendChild(d); };
    row(h <= m.nowH ? "R$ " + brl(interp(m.today, h)) : "—", "var(--pen)", "Hoje");
    row("R$ " + brl(interp(m.yest, h)), "var(--past)", "Ontem");
    tip.classList.add("on");
    overlay.style.opacity = "0";
    const left = (X / m.W) * r.width;
    tip.style.left = (left + 12 + tip.offsetWidth > r.width ? left - 12 - tip.offsetWidth : left + 12) + "px";
  };
  svg.addEventListener("pointermove", (e) => show(e.clientX));
  svg.addEventListener("pointerleave", () => { tip.classList.remove("on"); cross.style.display = "none"; overlay.style.opacity = "1"; });
  svg.setAttribute("tabindex", "0");
  svg.addEventListener("focus", () => { const r = svg.getBoundingClientRect(); show(r.left + (m.x(m.nowH) / m.W) * r.width); });
  svg.addEventListener("blur", () => { tip.classList.remove("on"); cross.style.display = "none"; overlay.style.opacity = "1"; });
}

  const a = t.dataset.act || t.dataset.proto;
  if (a === "noop") { e.preventDefault(); return; }
  if (a === "table") { state.chartTable = !state.chartTable; render(); return; }
  if (a === "csv") { t.innerHTML = `${ICON.check} Exportado`; return; }
  if (a === "resend") { const o = ORDERS.find((x) => x.ref === state.route.slice(7)); state.toast = `Recibo reenviado para ${o.email}.`; render(); return; }
  if (a === "refund") { openRefund(); return; }
  if (a === "sale") { newSale(); return; }
  if (a === "first") { state.firstDay = !state.firstDay; location.hash = "inicio"; render(); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { state.q = e.target.value; state.__focusQ = true; render(); }
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset.route;
  if (k) { state.routing[k] = e.target.value; state.toast = `Pronto: ${k === "card" ? "cartão" : k} agora cai no ${GATEWAYS.find((g) => g.id === e.target.value).name}.`; render(); }
});

function openRefund() {
  const o = ORDERS.find((x) => x.ref === state.route.slice(7));
  const d = document.getElementById("dlg");
  d.innerHTML = `<form method="dialog" class="in"><h2>Reembolsar R$ ${brl(o.amount)}?</h2>
    <p>O valor volta para ${esc(o.name)} ${o.method === "pix" ? "pelo mesmo Pix" : o.method === "card" ? "no cartão usado na compra" : "pela conta indicada no boleto"}, pelo ${GATEWAY[o.method]}. Isso não pode ser desfeito.</p>
    <div class="acts"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn danger" value="ok">Reembolsar</button></div></form>`;
  d.showModal();
  d.onclose = () => { if (d.returnValue === "ok") { o.status = "Reembolsado"; state.toast = `Reembolso pedido ao ${GATEWAY[o.method]}. O comprador recebe um e-mail.`; render(); } };
}
function newSale() {
  const p = PRODUCTS[0];
  const t = NOW.getTime() - 1000;
  const o = { ref: "PVX-" + (48214 + ORDERS.filter((x) => x.__new).length), t, name: "Sofia Andrade", email: "sofia.andrade@email.com", product: p, amount: p.price, method: "pix", status: "Aprovado", installments: 1, __new: true };
  ORDERS.unshift(o); state.fresh = o.ref; state.firstDay = false;
  if (location.hash !== "#inicio" && location.hash !== "") location.hash = "inicio"; else render();
}

/* ---------- prototype panel ---------- */
const panel = document.getElementById("protoPanel"), toggle = document.getElementById("protoToggle");
toggle.addEventListener("click", () => { const open = !panel.classList.contains("open"); panel.classList.toggle("open", open); toggle.setAttribute("aria-expanded", String(open)); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && panel.classList.contains("open")) { toggle.click(); toggle.focus(); } });
function renderPanel() {
  const cur = (h) => `aria-pressed="${state.route === h}"`;
  const firstRef = ORDERS.find((o) => o.status === "Aprovado")?.ref;
  panel.innerHTML = `<h3>Tela</h3><div class="chips">
      <button type="button" data-screen="inicio" ${cur("inicio")}>Visão geral</button><button type="button" data-screen="pedidos" ${cur("pedidos")}>Pedidos</button>
      <button type="button" data-screen="pedido/${firstRef}" ${cur("pedido/" + firstRef)}>Detalhe do pedido</button><button type="button" data-screen="produtos" ${cur("produtos")}>Produtos</button>
      <button type="button" data-screen="integracoes" ${cur("integracoes")}>Integrações</button></div>
    <h3>Simular</h3>
    <button type="button" class="proto-action" data-proto="sale">Uma venda de Pix acabou de cair</button>
    <button type="button" class="proto-action" data-proto="first" style="background:#1b1d21;color:#fff;border:1px solid #3a3d44">${state.firstDay ? "Voltar ao dia normal" : "Loja sem vendas (primeiro dia)"}</button>
    <p class="proto-note">Loja, compradores, valores e gráfico são dados de exemplo, com o relógio fixo em ${hhmm(NOW)}. As Conquistas PAVOX saíram do painel, como combinado.</p>`;
}

buildOrders();
go();
</script>
</body>
</html>
