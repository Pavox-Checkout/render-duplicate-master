:root {
  --navy: #001848; --navy-2: #0a2560; --navy-3: #1c3a7a;
  --blue: #0055fb; --blue-2: #0043c9; --blue-wash: #e6eeff; --hl: #c9daff;
  --ground: #fcfdfe; --ink: #0d1733; --ink-2: #444c63; --ink-3: #656d82;
  --rule: #e2e6ee; --rule-2: #cfd5e1; --on-navy-2: #b9c6e4;
  --bad: #b8322a; --ok: #1b7443;
  --display: "Bricolage Grotesque Variable", ui-sans-serif, system-ui, sans-serif;
  --ui: "Hanken Grotesk Variable", ui-sans-serif, system-ui, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; padding-top: 40px; }
::selection { background: var(--hl); color: var(--navy); }
#main:focus { outline: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
.side :focus-visible { outline-color: #fff; }
a { color: var(--blue); text-underline-offset: 3px; text-decoration-thickness: 1.5px; font-weight: 600; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.hl { background: linear-gradient(100deg, rgba(201,218,255,0) 0.6%, var(--hl) 2.4%, var(--hl) 95%, rgba(201,218,255,0) 98%) no-repeat 0 88% / 100% 55%; padding: 0 .1em; margin: 0 -.1em; border-radius: .2em .5em .3em .6em; }

.proto-bar { position: fixed; inset: 0 0 auto 0; z-index: 90; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: #0d0e10; color: #e9eaec; font-size: 12.5px; }
.proto-bar b { color: #fff; }
.proto-bar .g { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proto-bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.proto-bar nav a { flex: none; color: #cfd2d8; text-decoration: none; font-weight: 600; font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #30333a; }
.proto-bar nav a[aria-current="page"] { background: #fff; color: #0d0e10; border-color: #fff; }

.shell { display: grid; grid-template-rows: auto 1fr; min-height: calc(100svh - 40px); }
.side { background: var(--navy); color: #fff; padding: 18px 20px; }
.side .logo img { display: block; height: 26px; width: auto; }
.side .purpose, .side .steps, .side .foot { display: none; }
.side { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mstep { margin: 0; font-size: 13.5px; color: var(--on-navy-2); }
.mstep b { background: var(--hl); color: var(--navy); padding: 1px 6px; border-radius: 3px 6px 4px 7px; font-weight: 700; }
.mstep:empty { display: none; }
.main { padding: 28px 20px 48px; display: grid; align-content: start; justify-items: center; }
.box { width: 100%; max-width: 420px; }
.box.wide { max-width: 980px; }
h1 { margin: 0; font-family: var(--display); color: var(--navy); font-size: clamp(30px, 5vw, 40px); line-height: 1.05; letter-spacing: -0.035em; font-weight: 750; }
.sub { margin: 8px 0 0; color: var(--ink-2); }
.sub b { color: var(--ink); }
form { margin-top: 24px; display: grid; gap: 16px; }
.f label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: var(--navy); }
.f label a { font-size: 13.5px; }
.f input { width: 100%; height: 52px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--rule-2); background: #fff; font-size: 16px; color: var(--ink); caret-color: var(--navy); transition: border-color .15s, box-shadow .15s; }
.f input::placeholder { color: #7a8196; }
.f input:hover { border-color: #aab3c6; }
.f input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }
.f .pw { position: relative; }
.f .pw input { padding-right: 52px; }
.f .pw button { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border: 0; background: none; border-radius: 8px; color: var(--ink-3); display: grid; place-items: center; }
.f .pw button:hover { color: var(--navy); background: var(--blue-wash); }
.f .hint { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
.f .err { display: none; margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--bad); }
.f.bad input { border-color: var(--bad); }
.f.bad .err { display: block; }
.row2 { display: grid; gap: 16px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--ink-2); }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
.check.bad { color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 12px; border: 0; background: var(--blue); color: #fff; font-weight: 800; font-size: 16px; text-decoration: none; transition: background-color .15s, transform .12s var(--ease-out); box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .35); }
.btn:hover { background: var(--blue-2); color: #fff; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { cursor: progress; background: #5b86e8; }
.btn .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; border-right-color: transparent; animation: spin .8s linear infinite; }
.btn.ghost { background: #fff; color: var(--navy); border: 1.5px solid var(--rule-2); box-shadow: none; }
.btn.ghost:hover { border-color: var(--navy); }
.alt { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 15px; color: var(--ink-2); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 14.5px; font-weight: 600; }
.note.ok { background: #e3f1e8; color: #134f2f; }
.note.bad { background: #fbeceb; color: #7d1f19; }
.note svg { margin-top: 2px; }

.otp { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.otp input { width: 100%; height: 56px; padding: 0; text-align: center; border-radius: 10px; border: 1.5px solid var(--rule-2); background: #fff; font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.otp input:nth-child(4) { margin-right: 8px; }
.otp input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }
.otp.bad input { border-color: var(--bad); }
.otp.ok input { border-color: var(--ok); }
.resend { font-size: 15px; color: var(--ink-2); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; font-size: 15px; }
.linkbtn[disabled] { color: var(--ink-3); text-decoration: none; cursor: default; }

.plans { margin-top: 24px; display: grid; border-top: 1.5px solid var(--navy); }
.plan { display: grid; gap: 10px; align-content: start; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.plan .hd { display: flex; align-items: baseline; gap: 12px; min-height: 34px; }
.plan h2 { margin: 0; font-family: var(--display); font-size: 26px; color: var(--navy); letter-spacing: -0.02em; }
.plan .rec { font-size: 12.5px; font-weight: 800; color: var(--blue); letter-spacing: .04em; text-transform: uppercase; }
.plan .price { font-family: var(--display); font-size: 32px; font-weight: 750; color: var(--navy); letter-spacing: -0.03em; }
.plan .price small { font-family: var(--ui); font-size: 15px; color: var(--ink-3); font-weight: 600; letter-spacing: 0; }
.plan .fee { font-weight: 700; color: var(--ink-2); font-size: 15px; }
.plan .fee span { display: block; font-weight: 500; color: var(--ink-3); }
.plan ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14.5px; color: var(--ink-2); }
.plan li { display: flex; gap: 8px; }
.plan li svg { width: 16px; height: 16px; color: var(--blue); margin-top: 3px; }
.plan .btn { width: auto; justify-self: start; padding: 0 22px; }
.fine { margin-top: 18px; font-size: 14px; color: var(--ink-3); max-width: 70ch; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.shake { animation: shake .35s ease-in-out; }

@media (min-width: 700px) {
  .row2 { grid-template-columns: 1fr 1fr; }
  .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 0; }
  .plan { padding: 22px 22px 26px; border-bottom: 0; border-top: 1.5px solid var(--navy); border-left: 1px solid var(--rule); }
  .plan:first-child { border-left: 0; padding-left: 0; }
  .plan.recd { border-top: 4px solid var(--blue); padding-top: 19px; }
}
@media (min-width: 1024px) {
  .shell { grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: none; }
  .side { position: sticky; top: 40px; height: calc(100svh - 40px); padding: 40px 36px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; flex-wrap: nowrap; gap: 40px; }
  .side .logo img { height: 32px; }
  .mstep { display: none; }
  .side .purpose { display: block; margin: 0; font-family: var(--display); font-size: 30px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; }
  .side .steps { display: block; list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--navy-3); counter-reset: s; }
  .side .steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--navy-3); color: var(--on-navy-2); font-size: 15px; }
  .side .steps li::before { content: counter(s); font-weight: 800; color: #6f8ccc; }
  .side .steps li.done { color: #fff; }
  .side .steps li.done::before { content: ""; background: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%237fa6ff%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M5 12.5l4.5 4.5L19 7.5%27/%3E%3C/svg%3E") left center / 18px no-repeat; }
  .side .steps li.now { color: #fff; font-weight: 700; }
  .side .steps li.now span { background: var(--hl); color: var(--navy); padding: 1px 6px; margin: -1px -6px; border-radius: 3px 6px 4px 7px; }
  .side .foot { display: block; margin-top: auto; font-size: 13.5px; color: var(--on-navy-2); }
  .side .steps li span { justify-self: start; }
  .side .steps[hidden] { display: none; }
  .main { padding: 72px 48px; align-content: center; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<script>
const I = {
  eye: '<svg class="i" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.7M6.6 6.7C3.9 8.4 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  arrow: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 15.75v.01"/></svg>',
  mail: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg>',
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const st = { route: "entrar", email: "", values: {}, errors: {}, busy: false, note: null, cooldown: 0, code: "", codeState: "", plan: null };
const SCREENS = [["entrar", "Entrar"], ["esqueci", "Esqueci a senha"], ["cadastro", "Criar conta"], ["confirmar", "Confirmar e-mail"], ["plano", "Escolher plano"]];
const FLOW = [["cadastro", "Criar a conta"], ["confirmar", "Confirmar o e-mail"], ["plano", "Escolher o plano"], ["painel", "Conectar o gateway e vender"]];
const PLANS = [
  { slug: "free", name: "Free", price: 0, fee: 1.99, checkouts: "Até 3 checkouts", feats: ["Produtos ilimitados", "Checkout básico", "Gestão de produtos, pedidos e clientes"] },
  { slug: "growth", name: "Growth", price: 29.9, fee: 1.49, checkouts: "Até 10 checkouts", rec: true, feats: ["Domínio personalizado", "Order Bump", "Recuperação de vendas"] },
  { slug: "pro", name: "Pro", price: 99, fee: 0.99, checkouts: "Checkouts ilimitados", feats: ["Tudo do Growth", "Pavox AI", "A/B Testing"] },
];
const brl = (n) => n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function field(id, label, o = {}) {
  const v = st.values[id] ?? "", e = st.errors[id];
  const input = `<input id="${id}" name="${id}" type="${o.type || "text"}" value="${esc(v)}" ${o.ac ? `autocomplete="${o.ac}"` : ""} ${o.ph ? `placeholder="${o.ph}"` : ""} ${o.mode ? `inputmode="${o.mode}"` : ""} ${e ? `aria-invalid="true" aria-describedby="e-${id}"` : o.hint ? `aria-describedby="h-${id}"` : ""}>`;
  return `<div class="f ${e ? "bad" : ""}"><label for="${id}"><span>${label}</span>${o.aside || ""}</label>
    ${o.type === "password" ? `<div class="pw">${input}<button type="button" data-eye="${id}" aria-label="Mostrar senha">${I.eye}</button></div>` : input}
    ${o.hint && !e ? `<div class="hint" id="h-${id}">${o.hint}</div>` : ""}<div class="err" id="e-${id}" role="alert">${e ? esc(e) : ""}</div></div>`;
}
function btn(label, busyLabel) { return `<button class="btn" type="submit" ${st.busy ? "disabled" : ""}>${st.busy ? `<span class="spin" aria-hidden="true"></span>${busyLabel}` : `${label} ${I.arrow}`}</button>`; }
function note() { return st.note ? `<div class="note ${st.note[0]}" role="status">${st.note[0] === "ok" ? I.check : I.alert}<span>${esc(st.note[1])}</span></div>` : ""; }

const pages = {
  entrar: () => `<div class="box"><h1>Entre na PAVOX</h1><p class="sub">Seu painel, seus pedidos e seu extrato.</p>
    <form id="f-entrar" novalidate>${note()}
      ${field("email", "E-mail", { type: "email", ac: "email", mode: "email", ph: "voce@sualoja.com" })}
      ${field("senha", "Senha", { type: "password", ac: "current-password", aside: '<a href="#esqueci">Esqueci minha senha</a>' })}
      ${btn("Entrar", "Entrando")}
    </form>
    <p class="alt">Ainda não vende com a PAVOX? <a href="#cadastro">Criar conta grátis</a></p></div>`,
  esqueci: () => `<div class="box"><h1>Redefinir a senha</h1><p class="sub">Mandamos um link para o seu e-mail. Ele abre uma página para criar uma senha nova.</p>
    <form id="f-esqueci" novalidate>${note()}
      ${field("email", "E-mail da conta", { type: "email", ac: "email", mode: "email", ph: "voce@sualoja.com" })}
      ${btn("Enviar link", "Enviando")}
    </form><p class="alt"><a href="#entrar">Voltar para entrar</a></p></div>`,
  cadastro: () => `<div class="box"><h1>Crie sua conta</h1><p class="sub">Grátis no plano Free. Você escolhe o plano depois de confirmar o e-mail.</p>
    <form id="f-cadastro" novalidate>${note()}
      <div class="row2">${field("nome", "Seu nome", { ac: "name" })}${field("empresa", "Nome da loja", { ac: "organization" })}</div>
      ${field("email", "E-mail", { type: "email", ac: "email", mode: "email", ph: "voce@sualoja.com" })}
      <div class="row2">${field("senha", "Senha", { type: "password", ac: "new-password", hint: "Pelo menos 6 caracteres." })}${field("confirma", "Repita a senha", { type: "password", ac: "new-password" })}</div>
      <label class="check ${st.errors.termos ? "bad" : ""}"><input type="checkbox" id="termos" ${st.values.termos ? "checked" : ""}><span>Li e aceito os <a href="#" data-noop>Termos de Uso</a> e a <a href="#" data-noop>Política de Privacidade</a>.${st.errors.termos ? `<br><b>${st.errors.termos}</b>` : ""}</span></label>
      ${btn("Criar conta", "Criando a conta")}
    </form><p class="alt">Já tem conta? <a href="#entrar">Entrar</a></p></div>`,
  confirmar: () => `<div class="box"><h1>Confirme seu e-mail</h1><p class="sub">Digite o código de 8 números que mandamos para <b>${esc(st.email || "voce@sualoja.com")}</b>.</p>
    <form id="f-confirmar" novalidate>${note()}
      <div class="f"><label for="c0"><span>Código de confirmação</span></label>
      <div class="otp ${st.codeState}" id="otp" role="group" aria-label="Código de 8 números">${Array.from({ length: 8 }, (_, i) => `<input id="c${i}" inputmode="numeric" maxlength="1" autocomplete="${i ? "off" : "one-time-code"}" aria-label="Número ${i + 1}" value="${st.code[i] || ""}">`).join("")}</div></div>
      ${btn("Confirmar", "Confirmando")}
      <div class="resend">Não chegou? Veja o spam ou <button type="button" class="linkbtn" data-act="resend" ${st.cooldown ? "disabled" : ""}>${st.cooldown ? `reenviar em ${st.cooldown}s` : "reenviar o código"}</button></div>
    </form><p class="alt">E-mail errado? <a href="#cadastro">Voltar e corrigir</a></p></div>`,
  plano: () => `<div class="box wide"><h1>Escolha seu plano</h1><p class="sub">Você pode trocar quando quiser. A taxa da PAVOX vale só para vendas aprovadas e é separada da taxa do seu gateway.</p>
    ${note()}<div class="plans">${PLANS.map((p) => `<div class="plan ${p.rec ? "recd" : ""}"><div class="hd"><h2>${p.name}</h2>${p.rec ? '<span class="rec">Recomendado</span>' : ""}</div>
      <div class="price">R$ ${p.price ? brl(p.price) : "0"} <small>/mês</small></div>
      <div class="fee">${p.fee.toLocaleString("pt-BR")}% por venda aprovada<span>${p.checkouts}</span></div>
      <ul>${p.feats.map((f) => `<li>${I.check}${f}</li>`).join("")}</ul>
      <button type="button" class="btn ${p.slug === "free" || p.rec ? "" : "ghost"}" data-plan="${p.slug}" ${st.busy ? "disabled" : ""}>${st.busy && st.plan === p.slug ? `<span class="spin" aria-hidden="true"></span>Ativando` : p.slug === "free" ? "Começar grátis" : `Escolher ${p.name}`}</button></div>`).join("")}</div>
    <p class="fine">Nos planos Growth e Pro o acesso é liberado na hora. O pagamento da mensalidade será habilitado em breve.</p></div>`,
  pronto: () => `<div class="box"><h1>Plano ${esc(PLANS.find((p) => p.slug === st.plan)?.name || "Free")} ativado</h1><p class="sub">Sua conta está pronta. Próximo passo: conectar o gateway onde o dinheiro vai cair.</p>
    <div style="margin-top:24px"><a class="btn" href="painel-extrato.html#integracoes">Abrir o painel ${I.arrow}</a></div></div>`,
};

function render() {
  const r = pages[st.route] ? st.route : "entrar";
  document.getElementById("main").innerHTML = pages[r]();
  const inFlow = ["cadastro", "confirmar", "plano", "pronto"].includes(r);
  document.getElementById("purpose").textContent = inFlow ? "Em poucos minutos você está pronto para vender." : "Bom te ver de novo.";
  const idx = { cadastro: 0, confirmar: 1, plano: 2, pronto: 3 }[r];
  document.getElementById("steps").hidden = !inFlow;
  document.getElementById("mstep").innerHTML = inFlow && idx < 3 ? `${idx + 1} de 4 · <b>${FLOW[idx][1]}</b>` : "";
  document.getElementById("steps").innerHTML = FLOW.map(([k, l], i) => `<li class="${inFlow ? (i < idx ? "done" : i === idx ? "now" : "") : ""}"><span>${l}</span></li>`).join("");
  document.getElementById("ptip").innerHTML = `<b>Protótipo</b> · ${{ entrar: "teste o erro com a senha \"errada\"", confirmar: "qualquer código funciona, menos 00000000", pronto: "o botão abre o protótipo do painel" }[r] || "entrar e criar conta"}`;
  document.getElementById("pnav").innerHTML = SCREENS.map(([k, l]) => `<a href="#${k}" ${r === k ? 'aria-current="page"' : ""}>${l}</a>`).join("");
  document.title = `${{ entrar: "Entrar", esqueci: "Redefinir senha", cadastro: "Criar conta", confirmar: "Confirmar e-mail", plano: "Escolher plano", pronto: "Plano ativado" }[r]} · PAVOX`;
  if (r === "confirmar") wireOtp();
}
function go() { st.route = location.hash.slice(1) || "entrar"; st.errors = {}; st.note = null; st.busy = false; if (st.route === "confirmar") { st.code = ""; st.codeState = ""; if (!st.cooldown) { st.cooldown = 60; setTimeout(tick, 0); } } render(); if (st.route !== "confirmar") document.getElementById("main").focus({ preventScroll: true }); window.scrollTo(0, 0); }
window.addEventListener("hashchange", go);

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "termos") { st.values.termos = t.checked; return; }
  if (t.name) { st.values[t.name] = t.value; if (st.errors[t.name]) { delete st.errors[t.name]; t.closest(".f").classList.remove("bad"); t.removeAttribute("aria-invalid"); } }
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-eye],[data-act],[data-plan],[data-noop]");
  if (!t) return;
  if (t.hasAttribute("data-noop")) { e.preventDefault(); return; }
  if (t.dataset.eye) { const i = document.getElementById(t.dataset.eye); const show = i.type === "password"; i.type = show ? "text" : "password"; t.innerHTML = show ? I.eyeOff : I.eye; t.setAttribute("aria-label", show ? "Esconder senha" : "Mostrar senha"); return; }
  if (t.dataset.act === "resend") { st.cooldown = 60; st.note = ["ok", `Mandamos um código novo para ${st.email || "o seu e-mail"}.`]; render(); tick(); return; }
  if (t.dataset.plan) { st.plan = t.dataset.plan; st.busy = true; render(); setTimeout(() => { st.busy = false; location.hash = "pronto"; }, 900); return; }
});
function tick() { const id = setInterval(() => { st.cooldown--; const b = document.querySelector('[data-act="resend"]'); if (b) { b.disabled = st.cooldown > 0; b.textContent = st.cooldown > 0 ? `reenviar em ${st.cooldown}s` : "reenviar o código"; } if (st.cooldown <= 0) clearInterval(id); }, 1000); }

const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v || "");
function fail(errs) { st.errors = errs; render(); const f = document.querySelector('.f.bad input, .check.bad input'); f?.focus(); }
function busy(then, ms = 900) { st.busy = true; render(); setTimeout(() => { st.busy = false; then(); }, ms); }
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = st.values, id = e.target.id;
  if (id === "f-entrar") {
    const er = {}; if (!emailOk(v.email)) er.email = "Confira o e-mail."; if (!v.senha) er.senha = "Digite sua senha.";
    if (Object.keys(er).length) return fail(er);
    busy(() => { if (v.senha === "errada") { st.note = ["bad", "E-mail ou senha não conferem. Tente de novo ou redefina a senha."]; render(); } else { location.href = "painel-extrato.html#inicio"; } });
  }
  if (id === "f-esqueci") {
    if (!emailOk(v.email)) return fail({ email: "Digite o e-mail da sua conta." });
    busy(() => { st.note = ["ok", `Se existir uma conta com ${v.email}, o link chega em alguns minutos.`]; render(); });
  }
  if (id === "f-cadastro") {
    const er = {};
    if (!(v.nome || "").trim()) er.nome = "Digite seu nome.";
    if (!(v.empresa || "").trim()) er.empresa = "Digite o nome da loja.";
    if (!emailOk(v.email)) er.email = "Confira o e-mail: o código vai para ele.";
    if ((v.senha || "").length < 6) er.senha = "Use pelo menos 6 caracteres.";
    else if (v.confirma !== v.senha) er.confirma = "As senhas não são iguais.";
    if (!v.termos) er.termos = "Para criar a conta, aceite os termos.";
    if (Object.keys(er).length) return fail(er);
    st.email = v.email; busy(() => { location.hash = "confirmar"; });
  }
  if (id === "f-confirmar") verify();
});
function wireOtp() {
  const boxes = [...document.querySelectorAll("#otp input")];
  boxes.forEach((b, i) => {
    b.addEventListener("input", () => {
      const d = b.value.replace(/\D/g, "");
      if (d.length > 1) { d.split("").slice(0, 8 - i).forEach((c, k) => { boxes[i + k].value = c; }); }
      else b.value = d;
      st.code = boxes.map((x) => x.value).join("");
      const next = boxes.find((x) => !x.value); (next || boxes[7]).focus();
      if (st.code.length === 8) verify();
    });
    b.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !b.value && i) { boxes[i - 1].focus(); boxes[i - 1].value = ""; } });
    b.addEventListener("paste", (e) => { const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 8); if (!d) return; e.preventDefault(); d.split("").forEach((c, k) => { if (boxes[k]) boxes[k].value = c; }); st.code = d; if (d.length === 8) verify(); else boxes[d.length].focus(); });
  });
  (boxes.find((x) => !x.value) || boxes[0]).focus();
}
function verify() {
  if (st.code.length < 8) { st.note = ["bad", "O código tem 8 números."]; render(); return; }
  busy(() => {
    if (st.code === "00000000") { st.codeState = "bad"; st.code = ""; st.note = ["bad", "Código inválido ou vencido. Confira o e-mail ou peça um novo."]; render(); document.getElementById("otp").classList.add("shake"); }
    else { st.codeState = "ok"; render(); setTimeout(() => { location.hash = "plano"; }, 500); }
  }, 700);
}
go();
</script>
</body>
</html>
