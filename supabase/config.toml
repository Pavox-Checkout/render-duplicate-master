project_id = "cipiezekcudcvivtdnpr"

# Buyers are anonymous; authorization happens in the SQL functions.
[functions.public-checkout]
verify_jwt = false

# Authenticates the merchant in code (supports the new non-JWT API keys).
[functions.integrations]
verify_jwt = false

# Called by Mercado Pago; the notification is re-validated against the API.
[functions.mercadopago-webhook]
verify_jwt = false

# Authenticates the merchant in code. Needs the VERCEL_TOKEN secret.
[functions.domains]
verify_jwt = false

# Called by Asaas; checks the asaas-access-token header and re-reads the charge.
[functions.asaas-webhook]
verify_jwt = false

[functions.mercadopago-oauth]
verify_jwt = false

# Merchant order actions (refund, resend receipt); authenticates in code.
[functions.orders]
verify_jwt = false
